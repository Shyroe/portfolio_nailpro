<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nail Pro">
  <!-- Fundo escuro vinho da marca com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#360040" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#ff0078" stroke-width="2.5" />

  <!-- Tampa do esmalte branca -->
  <rect x="27" y="11" width="10" height="15" rx="2" fill="#ffffff" />
  <!-- Anel dourado -->
  <rect x="25" y="24" width="14" height="3" rx="1.5" fill="#ffd700" />

  <!-- Frasco do esmalte rosa vibrante -->
  <rect x="17" y="27" width="30" height="25" rx="6" fill="#ff0078" />

  <!-- Brilho no frasco -->
  <rect x="21" y="31" width="3.5" height="17" rx="1.5" fill="#ffffff" opacity="0.75" />
  <rect x="26" y="31" width="1.5" height="17" rx="0.75" fill="#ffffff" opacity="0.4" />

  <!-- Estrela de brilho / Nail Art -->
  <polygon points="46,16 47.5,20 51,21.5 47.5,23 46,27 44.5,23 41,21.5 44.5,20" fill="#ffffff" />
  <circle cx="46" cy="21.5" r="1.2" fill="#ffd700" />
</svg>
